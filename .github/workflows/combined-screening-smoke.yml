name: combined-screening-smoke

on:
  push:
    branches: [combined-short-long-range-screening]
    paths:
      - .github/workflows/combined-screening-smoke.yml
      - src/holstein_peierls/two_particle/**
      - experiments/bipolaron_long_range_coulomb_scan.py
      - tests/test_short_range_shell_overrides.py
      - tests/test_long_range_coulomb_peierls.py
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run targeted tests
        run: pytest tests/test_short_range_shell_overrides.py tests/test_long_range_coulomb.py tests/test_long_range_coulomb_peierls.py
      - name: Pure continuum control
        run: |
          python experiments/bipolaron_long_range_coulomb_scan.py \
            --size 6 --u-values 0.525 --epsilon-values 10 \
            --branches onsite intersite_x diagonal separated \
            --max-iterations 700 \
            --output smoke/pure
      - name: Cardinal short-range replacement
        run: |
          python experiments/bipolaron_long_range_coulomb_scan.py \
            --size 6 --u-values 0.525 --epsilon-values 10 \
            --v1 0.16 \
            --branches onsite intersite_x diagonal separated \
            --max-iterations 700 \
            --output smoke/cardinal
      - name: Cardinal plus diagonal replacement
        run: |
          python experiments/bipolaron_long_range_coulomb_scan.py \
            --size 6 --u-values 0.525 --epsilon-values 10 \
            --v1 0.16 --shell-override 1,1,0.11 \
            --branches onsite intersite_x diagonal separated \
            --max-iterations 700 \
            --output smoke/cardinal-diagonal
      - name: Extend replacement through second axial shell
        run: |
          python experiments/bipolaron_long_range_coulomb_scan.py \
            --size 6 --u-values 0.525 --epsilon-values 10 \
            --v1 0.16 --shell-override 1,1,0.11 \
            --shell-override 2,0,0.08 --shell-override 0,2,0.08 \
            --branches onsite intersite_x diagonal separated \
            --max-iterations 700 \
            --output smoke/extended
      - name: Upload smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: combined-screening-smoke-${{ github.sha }}
          path: smoke
          if-no-files-found: error
          retention-days: 30
