name: bipolaron-exploratory-scan

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'src/holstein_peierls/two_particle/**'
      - 'experiments/bipolaron_holstein_hubbard_scan.py'
      - '.github/workflows/bipolaron-exploratory-scan.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run exploratory 6x6 Holstein-Hubbard scan
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_holstein_hubbard_scan.py
          --nx 6 --ny 6
          --u-values 0.0 0.2 0.4 0.55 0.7 1.0
          --output bipolaron-scan
      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-holstein-hubbard-6x6
          path: bipolaron-scan/
          retention-days: 90
