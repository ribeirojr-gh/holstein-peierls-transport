name: bipolaron-long-range-pilot

on:
  push:
    branches: [screened-long-range-coulomb]
    paths:
      - .github/workflows/bipolaron-long-range-pilot.yml
  workflow_dispatch:

jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: u0525, U: 0.525}
          - {label: u1000, U: 1.0}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run 10x10 long-range Coulomb pilot
        run: >-
          python experiments/bipolaron_long_range_coulomb_scan.py
          --size 10
          --u-values ${{ matrix.U }}
          --epsilon-values 3 10 30 100 300
          --ax 7.0
          --ay 7.0
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --max-iterations 1200
          --output long-range-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-pilot-${{ matrix.label }}
          path: long-range-${{ matrix.label }}
          if-no-files-found: error
