name: d0b-benchmark-temporary

on:
  pull_request:

jobs:
  d0b-benchmark:
    if: github.head_ref == 'd0b-spin-adapted-projector-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run D0b spin-adapted benchmark
        run: |
          mkdir -p benchmark
          python experiments/d0b_spin_adapted_projectors.py \
            --size 4 \
            --staggered-gap 2.0 \
            --onsite-u 0.8 \
            --nearest-neighbor-v 0.2 \
            --kick-angle 0.05 \
            --final-time-fs 0.4 \
            --dt-values 0.04 0.02 0.01 \
            --output benchmark/d0b-projectors.json \
            --markdown benchmark/d0b-projectors.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d0b-spin-adapted-projectors
          path: benchmark/d0b-projectors.*
