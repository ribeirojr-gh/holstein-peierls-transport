name: bipolaron-long-range-refine

on:
  push:
    branches: [screened-long-range-coulomb]
    paths:
      - .github/workflows/bipolaron-long-range-refine.yml
  workflow_dispatch:

jobs:
  refine-u0525:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Refine onsite binding threshold
        run: >-
          python experiments/bipolaron_long_range_coulomb_scan.py
          --size 10
          --u-values 0.525
          --epsilon-values 4 5 6 7 8 9 10
          --branches onsite separated
          --ax 7.0
          --ay 7.0
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --max-iterations 1200
          --output long-range-u0525-refine
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-u0525-refine
          path: long-range-u0525-refine
          if-no-files-found: error

  refine-u1000:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Refine axial binding threshold
        run: >-
          python experiments/bipolaron_long_range_coulomb_scan.py
          --size 10
          --u-values 1.0
          --epsilon-values 300 400 500 700 1000 2000
          --branches intersite_x diagonal separated
          --ax 7.0
          --ay 7.0
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --max-iterations 1200
          --output long-range-u1000-refine
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-u1000-refine
          path: long-range-u1000-refine
          if-no-files-found: error
