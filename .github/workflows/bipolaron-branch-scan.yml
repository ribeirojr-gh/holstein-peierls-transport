name: bipolaron-branch-scan

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'src/holstein_peierls/two_particle/**'
      - 'experiments/bipolaron_branch_scan.py'
      - '.github/workflows/bipolaron-branch-scan.yml'
  workflow_dispatch:

jobs:
  branch-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run 10x10 branch scan
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_branch_scan.py
          --size 10
          --u-values 0.45 0.50 0.525 0.55 0.60 0.70 0.80 0.90 1.00 1.20 1.50
          --output bipolaron-branches
      - name: Upload branch scan
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-branch-scan-10x10
          path: bipolaron-branches/
          retention-days: 90
