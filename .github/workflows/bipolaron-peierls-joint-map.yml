name: bipolaron-peierls-joint-map

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - '.github/workflows/bipolaron-peierls-joint-map.yml'
  workflow_dispatch:

jobs:
  joint-peierls-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alpha_y: ['0.000', '0.060', '0.120']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Map joint alpha-x and alpha-y couplings
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_peierls_scan.py
          --size 10
          --alpha-x-values 0.000 0.050 0.100
          --alpha-y ${{ matrix.alpha_y }}
          --u-values 0.450 0.475 0.4875 0.500 0.5125 0.525 0.550 0.700 1.000 1.100 1.200
          --max-iterations 1200
          --displacement-tolerance 1e-6
          --gradient-tolerance 2e-5
          --output joint-peierls-ay-${{ matrix.alpha_y }}
      - name: Upload joint-map results
        uses: actions/upload-artifact@v4
        with:
          name: joint-peierls-10x10-ay-${{ matrix.alpha_y }}
          path: joint-peierls-ay-${{ matrix.alpha_y }}/
          retention-days: 90
