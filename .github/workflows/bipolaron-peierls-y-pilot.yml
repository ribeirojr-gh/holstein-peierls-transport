name: bipolaron-peierls-y-pilot

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - '.github/workflows/bipolaron-peierls-y-pilot.yml'
  workflow_dispatch:

jobs:
  peierls-y-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Probe alpha-y with alpha-x disabled
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          for ay in 0.000 0.010 0.020 0.040 0.080 0.160; do
            echo "=== alpha_y=${ay} eV/A ==="
            python experiments/bipolaron_peierls_scan.py \
              --size 8 \
              --alpha-x-values 0.000 \
              --alpha-y "${ay}" \
              --u-values 0.450 0.500 0.525 0.700 1.000 \
              --max-iterations 1200 \
              --displacement-tolerance 1e-6 \
              --gradient-tolerance 2e-5 \
              --output "bipolaron-peierls-y-${ay}"
          done
      - name: Upload y-pilot results
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-peierls-y-pilot-8x8
          path: 'bipolaron-peierls-y-*/'
          retention-days: 90
