name: bipolaron-long-range-bracket

on:
  push:
    branches: [screened-long-range-coulomb]
    paths:
      - .github/workflows/bipolaron-long-range-bracket.yml
  workflow_dispatch:

jobs:
  bracket-u0525:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Close 10x10 U0525 bracket
        run: >-
          python experiments/bipolaron_long_range_coulomb_scan.py
          --size 10
          --u-values 0.525
          --epsilon-values 6.75 6.85
          --branches onsite separated
          --ax 7.0 --ay 7.0
          --j0x 0.0575 --j0y 0.0575
          --alpha-x 0.10 --alpha-y 0.10
          --max-iterations 1200
          --output bracket10-u0525
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-bracket10-u0525
          path: bracket10-u0525
          if-no-files-found: error

  bracket-u1000:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Close 10x10 U1000 bracket
        run: >-
          python experiments/bipolaron_long_range_coulomb_scan.py
          --size 10
          --u-values 1.0
          --epsilon-values 560 580
          --branches intersite_x diagonal separated
          --ax 7.0 --ay 7.0
          --j0x 0.0575 --j0y 0.0575
          --alpha-x 0.10 --alpha-y 0.10
          --max-iterations 1200
          --output bracket10-u1000
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-bracket10-u1000
          path: bracket10-u1000
          if-no-files-found: error
