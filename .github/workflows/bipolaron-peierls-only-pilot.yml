name: bipolaron-peierls-only-pilot

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'experiments/bipolaron_peierls_only_scan.py'
      - '.github/workflows/bipolaron-peierls-only-pilot.yml'
      - 'src/holstein_peierls/**'
  workflow_dispatch:

jobs:
  peierls-only-pilot:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Probe pure Peierls pairing
        run: |
          python experiments/bipolaron_peierls_only_scan.py \
            --size 6 \
            --alpha-x-values 0.10 0.20 0.30 0.40 \
            --alpha-y 0.00 \
            --u-values 0.0 0.5 1.0 \
            --seed-amplitudes 0.02 0.05 \
            --max-iterations 1200 \
            --displacement-tolerance 1e-6 \
            --gradient-tolerance 2e-5 \
            --output peierls-only-pilot-6x6
      - name: Upload pilot results
        uses: actions/upload-artifact@v4
        with:
          name: peierls-only-pilot-6x6
          path: peierls-only-pilot-6x6/
          retention-days: 90
