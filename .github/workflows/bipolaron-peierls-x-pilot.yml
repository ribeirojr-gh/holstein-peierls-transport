name: bipolaron-peierls-x-pilot

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'src/holstein_peierls/two_particle/peierls.py'
      - 'src/holstein_peierls/two_particle/parameters.py'
      - 'experiments/bipolaron_peierls_scan.py'
      - '.github/workflows/bipolaron-peierls-x-pilot.yml'
  workflow_dispatch:

jobs:
  peierls-x-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [6, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Scan alpha-x with alpha-y disabled
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_peierls_scan.py
          --size ${{ matrix.size }}
          --alpha-x-values 0.00 0.05 0.10 0.20 0.40
          --alpha-y 0.00
          --u-values 0.500 0.525 0.550 0.700 1.000
          --max-iterations 1000
          --displacement-tolerance 1e-6
          --gradient-tolerance 2e-5
          --output bipolaron-peierls-x-${{ matrix.size }}
      - name: Upload pilot results
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-peierls-x-${{ matrix.size }}x${{ matrix.size }}
          path: bipolaron-peierls-x-${{ matrix.size }}/
          retention-days: 90
