name: combined-screening-range20

on:
  push:
    branches: [combined-screening-range-sensitivity]
    paths:
      - .github/workflows/combined-screening-range20.yml
  workflow_dispatch:

jobs:
  range20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run strict 20x20 range brackets
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          from dataclasses import replace
          from pathlib import Path

          import numpy as np

          from holstein_peierls.parameters import StaticPolaronParameters
          from holstein_peierls.polaron import solve_static_polaron
          from holstein_peierls.two_particle.interaction import interaction_expectation
          from holstein_peierls.two_particle.observables import pair_observables
          from holstein_peierls.two_particle.parameters import BipolaronParameters
          from holstein_peierls.two_particle.peierls import relax_static_holstein_peierls_bipolaron
          from experiments.bipolaron_long_range_coulomb_scan import (
              center_position,
              classify_final_state,
              diagonal_probability,
              distortion_ratios,
              seed_state,
          )

          prefactor = 14.3996454784255
          spacing = 7.0
          eta = 0.75
          size = 20
          root = Path('range20')
          root.mkdir(exist_ok=True)

          models = {
              'R1_cardinal': [(1, 0), (0, 1)],
              'R2_cardinal_diagonal': [(1, 0), (0, 1), (1, 1)],
              'R3_through_second_axial': [
                  (1, 0), (0, 1), (1, 1), (2, 0), (0, 2)
              ],
          }
          grids = {
              0.525: [5.0, 5.6],
              1.0: [370.0, 430.0],
          }
          branches = {
              0.525: ['onsite', 'intersite_x', 'diagonal', 'separated'],
              1.0: ['intersite_x', 'diagonal', 'separated'],
          }

          single = StaticPolaronParameters(
              nx=size,
              ny=size,
              polaron_position=center_position(size),
              j0x=0.0575,
              j0y=0.0575,
              alpha_interx=0.10,
              alpha_intery=0.10,
          )
          polaron = solve_static_polaron(
              single,
              solver='sparse',
              gradient_mode='optimized',
              legacy_convergence=False,
          )
          two_polaron_reference = 2.0 * polaron.total_energy
          summary = []
          branches_out = []

          def continuum(dx: int, dy: int, epsilon: float) -> float:
              r = spacing * math.sqrt(dx * dx + dy * dy)
              return prefactor / epsilon / r

          for model, shells in models.items():
              for u, eps_values in grids.items():
                  for epsilon in eps_values:
                      overrides = tuple(
                          (dx, dy, eta * continuum(dx, dy, epsilon))
                          for dx, dy in shells
                      )
                      parameters = BipolaronParameters.from_polaron_parameters(
                          single,
                          hubbard_u=u,
                          long_range_coulomb=True,
                          lattice_spacing_x_angstrom=spacing,
                          lattice_spacing_y_angstrom=spacing,
                          relative_permittivity=epsilon,
                          short_range_shell_overrides=overrides,
                      )
                      parameters = replace(
                          parameters,
                          pair_position=center_position(size),
                          max_iterations=1800,
                          convergence_criterion=1.0e-8,
                          gradient_convergence_criterion=1.0e-6,
                          eigensolver_tolerance=1.0e-11,
                      )

                      candidates = {}
                      for branch in branches[u]:
                          result = relax_static_holstein_peierls_bipolaron(
                              parameters,
                              initial_state=seed_state(parameters, branch),
                          )
                          obs = pair_observables(result.ground_state, parameters)
                          pdiag = diagonal_probability(
                              result.ground_state.wavefunction, parameters
                          )
                          final_state = classify_final_state(obs, pdiag)
                          ratio_x, ratio_y = distortion_ratios(result, parameters)
                          eint = interaction_expectation(
                              result.ground_state.wavefunction, parameters
                          )
                          entry = {
                              'model': model,
                              'eta': eta,
                              'size': size,
                              'U_eV': u,
                              'epsilon_r': epsilon,
                              'overrides': overrides,
                              'seed': branch,
                              'final_state': final_state,
                              'total_energy_eV': result.energy.total,
                              'binding_vs_2polaron_eV': two_polaron_reference - result.energy.total,
                              'interaction_energy_eV': eint,
                              'P_onsite': obs.onsite_probability,
                              'P_nn_x': obs.nearest_neighbour_x_probability,
                              'P_nn_y': obs.nearest_neighbour_y_probability,
                              'P_diagonal': pdiag,
                              'mean_r': obs.mean_separation,
                              'max_delta_tx_over_Jx': ratio_x,
                              'max_delta_ty_over_Jy': ratio_y,
                              'iterations': result.diagnostics.iterations,
                              'converged': result.diagnostics.converged,
                              'final_max_update_A': result.diagnostics.final_max_update,
                              'final_max_gradient_eV_per_A': result.diagnostics.final_max_gradient,
                          }
                          branches_out.append(entry)
                          candidates[branch] = (result, entry)

                      best_seed = min(
                          candidates,
                          key=lambda name: candidates[name][0].energy.total,
                      )
                      best_result, best = candidates[best_seed]
                      separated = candidates['separated'][0].energy.total
                      minimum = dict(best)
                      minimum.update({
                          'best_seed': best_seed,
                          'best_final_state': best['final_state'],
                          'best_energy_eV': best_result.energy.total,
                          'finite_separated_energy_eV': separated,
                          'finite_separated_excess_eV': separated - two_polaron_reference,
                          'one_polaron_energy_eV': polaron.total_energy,
                          'two_polaron_reference_eV': two_polaron_reference,
                          'all_branches_converged': all(
                              item[0].diagnostics.converged for item in candidates.values()
                          ),
                          'max_branch_update_A': max(
                              item[0].diagnostics.final_max_update for item in candidates.values()
                          ),
                          'max_branch_gradient_eV_per_A': max(
                              item[0].diagnostics.final_max_gradient for item in candidates.values()
                          ),
                      })
                      summary.append(minimum)
                      print(
                          f"{model:26s} U={u:.3f} eps={epsilon:7.2f} "
                          f"state={minimum['best_final_state']:11s} "
                          f"Ebind={1000*minimum['binding_vs_2polaron_eV']:+10.5f} meV "
                          f"update={minimum['max_branch_update_A']:.3e} A "
                          f"grad={minimum['max_branch_gradient_eV_per_A']:.3e} eV/A "
                          f"conv={minimum['all_branches_converged']}"
                      )

          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          (root / 'branches.json').write_text(json.dumps(branches_out, indent=2) + '\n')
          print(f'One-polaron energy: {polaron.total_energy:.12f} eV')
          print(f'Two-polaron reference: {two_polaron_reference:.12f} eV')
          PY
      - name: Upload strict 20x20 outputs
        uses: actions/upload-artifact@v4
        with:
          name: combined-screening-range20-${{ github.sha }}
          path: range20
          if-no-files-found: error
          retention-days: 30
