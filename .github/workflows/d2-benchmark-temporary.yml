name: d2-benchmark-temporary

on:
  pull_request:

jobs:
  d2-benchmark:
    if: github.head_ref == 'd2-coupled-zero-temperature'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run D2 coupled zero-temperature benchmark
        run: |
          mkdir -p benchmark
          python experiments/d2_coupled_zero_temperature.py \
            --size 20 \
            --final-time-fs 10.0 \
            --dt-values 0.2 0.1 0.05 \
            --kick-velocity-a-per-fs 2.0e-4 \
            --krylov-dimension 6 \
            --reference-rtol 1.0e-9 \
            --reference-atol 1.0e-11 \
            --reference-max-step-fs 0.02 \
            --output benchmark/d2-coupled.json \
            --markdown benchmark/d2-coupled.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-coupled-zero-temperature
          path: benchmark/d2-coupled.*
