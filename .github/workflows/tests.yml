name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  d0a-frozen-propagators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic D0a benchmark
        run: |
          mkdir -p benchmark
          python experiments/d0a_frozen_propagators.py \
            --nx 4 \
            --ny 4 \
            --dt-fs 0.1 \
            --steps 20 \
            --krylov-dimension 8 \
            --output benchmark/d0a-frozen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d0a-frozen-propagators
          path: benchmark/d0a-frozen.json

  s0-relaxation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        multiplicity: [singlet, triplet]
        seed: [onsite, bond_x, bond_y]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run 4x4 S0 relaxation branch
        run: |
          mkdir -p benchmark
          python experiments/spin_adapted_isotropic_relaxation.py \
            --size 4 \
            --staggered-gap 2.0 \
            --multiplicity '${{ matrix.multiplicity }}' \
            --seed '${{ matrix.seed }}' \
            --require-converged \
            --output 'benchmark/${{ matrix.multiplicity }}-${{ matrix.seed }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-${{ matrix.multiplicity }}-${{ matrix.seed }}
          path: benchmark/*.json
