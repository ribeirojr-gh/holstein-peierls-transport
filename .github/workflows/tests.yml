name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  exciton-reference-20x20:
    strategy:
      fail-fast: false
      matrix:
        mode: [frenkel, ct_x, ct_y, diagonal, separated]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run strict 20x20 branch
        run: |
          mkdir -p exciton-20x20
          python experiments/exciton_reference_branch_benchmark.py \
            --size 20 \
            --onsite-attraction 0.525 \
            --max-iterations 2200 \
            --mode ${{ matrix.mode }} \
            --output exciton-20x20/${{ matrix.mode }}.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: exciton-reference-20x20-${{ matrix.mode }}-${{ github.sha }}
          path: exciton-20x20/${{ matrix.mode }}.json
