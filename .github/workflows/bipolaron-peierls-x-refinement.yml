name: bipolaron-peierls-x-refinement

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'experiments/bipolaron_peierls_scan.py'
      - '.github/workflows/bipolaron-peierls-x-refinement.yml'
  workflow_dispatch:

jobs:
  peierls-x-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [8, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Refine alpha-x with alpha-y disabled
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_peierls_scan.py
          --size ${{ matrix.size }}
          --alpha-x-values 0.000 0.025 0.050 0.075 0.100 0.125 0.150
          --alpha-y 0.000
          --u-values 0.450 0.475 0.500 0.5125 0.525 0.550 0.700 1.000 1.100 1.200
          --max-iterations 1200
          --displacement-tolerance 1e-6
          --gradient-tolerance 2e-5
          --output bipolaron-peierls-x-refinement-${{ matrix.size }}
      - name: Upload refinement results
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-peierls-x-refinement-${{ matrix.size }}x${{ matrix.size }}
          path: bipolaron-peierls-x-refinement-${{ matrix.size }}/
          retention-days: 90
