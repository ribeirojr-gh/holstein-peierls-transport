name: bipolaron-size-scaling-20x40

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - '.github/workflows/bipolaron-size-scaling-20x40.yml'
  workflow_dispatch:

jobs:
  size-scaling:
    strategy:
      fail-fast: false
      matrix:
        size: [20, 40]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compare robust bound and separated branches
        run: |
          python experiments/bipolaron_peierls_scan.py \
            --size ${{ matrix.size }} \
            --alpha-x-values 0.100 \
            --alpha-y 0.120 \
            --u-values 0.525 1.000 \
            --max-iterations 1200 \
            --displacement-tolerance 1e-6 \
            --gradient-tolerance 2e-5 \
            --output bipolaron-size-scaling-${{ matrix.size }}
      - name: Upload size-scaling results
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-size-scaling-${{ matrix.size }}x${{ matrix.size }}
          path: bipolaron-size-scaling-${{ matrix.size }}/
          retention-days: 90
