name: bipolaron-long-range-size-scaling

on:
  push:
    branches: [screened-long-range-coulomb]
    paths:
      - .github/workflows/bipolaron-long-range-size-scaling.yml
  workflow_dispatch:

jobs:
  separated-size-scaling:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: l10-eps10, size: 10, eps: 10}
          - {label: l20-eps10, size: 20, eps: 10}
          - {label: l40-eps10, size: 40, eps: 10}
          - {label: l10-eps100, size: 10, eps: 100}
          - {label: l20-eps100, size: 20, eps: 100}
          - {label: l40-eps100, size: 40, eps: 100}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run separated finite-size benchmark
        run: >-
          python experiments/bipolaron_long_range_coulomb_scan.py
          --size ${{ matrix.size }}
          --u-values 1.0
          --epsilon-values ${{ matrix.eps }}
          --branches separated
          --ax 7.0
          --ay 7.0
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --max-iterations 1600
          --output long-range-size-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-size-${{ matrix.label }}
          path: long-range-size-${{ matrix.label }}
          if-no-files-found: error
