name: d3-benchmark-temporary

on:
  pull_request:
    branches: [main]

jobs:
  d3-benchmark:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run D3 field-driven benchmark
        run: |
          mkdir -p benchmark
          python experiments/d3_field_driven_zero_temperature.py \
            --size 20 \
            --field-mv-per-a 2.0 \
            --final-time-fs 10.0 \
            --dt-values 0.2 0.1 0.05 \
            --krylov-dimension 6 \
            --reference-rtol 1e-9 \
            --reference-atol 1e-11 \
            --reference-max-step-fs 0.02 \
            --output benchmark/d3-field.json \
            --markdown benchmark/d3-field.md
          cat benchmark/d3-field.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-field-driven-zero-temperature
          path: benchmark/d3-field.*
          if-no-files-found: warn
