name: bipolaron-final-validation

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'src/holstein_peierls/two_particle/**'
      - 'experiments/bipolaron_branch_scan.py'
      - 'tests/test_bipolaron.py'
      - '.github/workflows/bipolaron-final-validation.yml'
  workflow_dispatch:

jobs:
  finite-size-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [6, 8, 10, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run stationary multi-branch validation
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_branch_scan.py
          --size ${{ matrix.size }}
          --u-values 0.500 0.505 0.510 0.515 0.520 0.525 0.550 0.700 1.000 1.100 1.200 1.300 1.500
          --max-iterations 1200
          --displacement-tolerance 1e-7
          --gradient-tolerance 1e-6
          --output bipolaron-final-${{ matrix.size }}
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-final-${{ matrix.size }}x${{ matrix.size }}
          path: bipolaron-final-${{ matrix.size }}/
          retention-days: 90
