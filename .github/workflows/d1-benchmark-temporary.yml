name: d1-benchmark-temporary

on:
  pull_request:

jobs:
  d1-benchmark:
    if: github.head_ref == 'd1-frozen-lattice-electric-field'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run D1 frozen-lattice field benchmark
        run: |
          mkdir -p benchmark
          python experiments/d1_frozen_lattice_field.py \
            --linear-size 20 \
            --field-mv-per-a 2.0 \
            --linear-final-time-fs 20.0 \
            --linear-dt-values 0.2 0.1 \
            --krylov-dimensions 6 8 \
            --spin-final-time-fs 1.0 \
            --spin-dt-values 0.04 0.02 0.01 \
            --output benchmark/d1-field.json \
            --markdown benchmark/d1-field.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-frozen-lattice-field
          path: benchmark/d1-field.*
