name: bipolaron-long-range-strict40

on:
  push:
    branches: [screened-long-range-coulomb]
    paths:
      - .github/workflows/bipolaron-long-range-strict40.yml
  workflow_dispatch:

jobs:
  strict40:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: u0525-eps6p8-onsite, U: 0.525, eps: 6.8, branch: onsite}
          - {label: u0525-eps7p2-onsite, U: 0.525, eps: 7.2, branch: onsite}
          - {label: u1000-eps480-x, U: 1.0, eps: 480.0, branch: intersite_x}
          - {label: u1000-eps540-x, U: 1.0, eps: 540.0, branch: intersite_x}
          - {label: u1000-eps540-diag, U: 1.0, eps: 540.0, branch: diagonal}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run strict 40x40 long-range branch
        run: >-
          python experiments/bipolaron_branch_benchmark_seeded.py
          --size 40
          --u ${{ matrix.U }}
          --branch ${{ matrix.branch }}
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --long-range
          --ax 7.0
          --ay 7.0
          --epsilon-r ${{ matrix.eps }}
          --max-iterations 1200
          --output strict40-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-strict40-${{ matrix.label }}
          path: strict40-${{ matrix.label }}
          if-no-files-found: error
