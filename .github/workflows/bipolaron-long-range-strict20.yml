name: bipolaron-long-range-strict20

on:
  push:
    branches: [screened-long-range-coulomb]
    paths:
      - .github/workflows/bipolaron-long-range-strict20.yml
  workflow_dispatch:

jobs:
  strict20:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: u0525-eps6-onsite, U: 0.525, eps: 6.0, branch: onsite}
          - {label: u0525-eps8-onsite, U: 0.525, eps: 8.0, branch: onsite}
          - {label: u1000-eps500-x, U: 1.0, eps: 500.0, branch: intersite_x}
          - {label: u1000-eps700-x, U: 1.0, eps: 700.0, branch: intersite_x}
          - {label: u1000-eps500-diag, U: 1.0, eps: 500.0, branch: diagonal}
          - {label: u1000-eps700-diag, U: 1.0, eps: 700.0, branch: diagonal}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run strict 20x20 long-range branch
        run: >-
          python experiments/bipolaron_branch_benchmark_seeded.py
          --size 20
          --u ${{ matrix.U }}
          --branch ${{ matrix.branch }}
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --long-range
          --ax 7.0
          --ay 7.0
          --epsilon-r ${{ matrix.eps }}
          --max-iterations 1200
          --output strict20-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-long-range-strict20-${{ matrix.label }}
          path: strict20-${{ matrix.label }}
          if-no-files-found: error
