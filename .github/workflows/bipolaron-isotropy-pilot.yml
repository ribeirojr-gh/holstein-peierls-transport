name: bipolaron-isotropy-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-isotropy-pilot.yml
  workflow_dispatch:

jobs:
  refined-eta:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: u0525-refined-eta
            U: 0.525
          - label: u1000-refined-eta
            U: 1.000
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Refine fixed-bandwidth anisotropy crossing
        run: >-
          python experiments/bipolaron_anisotropy_scan.py
          --size 10
          --u ${{ matrix.U }}
          --v1 0.0
          --hopping-sum 0.115
          --eta-values 0.80 0.85 0.90 0.95
          --alpha-x 0.10
          --alpha-y 0.12
          --max-iterations 1200
          --output isotropy-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-isotropy-${{ matrix.label }}
          path: isotropy-${{ matrix.label }}
          if-no-files-found: error
