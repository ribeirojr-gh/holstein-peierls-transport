name: bipolaron-isotropy-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-isotropy-pilot.yml
  workflow_dispatch:

jobs:
  strict-size20-refinement:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Reuse eta=0.80 from the previous strict run; evaluate the opposite side.
          - label: eta082-u0525-x
            Jx: 0.0631868131868132
            Jy: 0.0518131868131868
            ax: 0.10
            ay: 0.12
            U: 0.525
            V1: 0.0
            branch: intersite_x
          - label: eta082-u0525-on
            Jx: 0.0631868131868132
            Jy: 0.0518131868131868
            ax: 0.10
            ay: 0.12
            U: 0.525
            V1: 0.0
            branch: onsite

          # Reuse eta=0.87 from the previous strict run; evaluate the opposite side.
          - label: eta085-u1000-x
            Jx: 0.0621621621621622
            Jy: 0.0528378378378378
            ax: 0.10
            ay: 0.12
            U: 1.0
            V1: 0.0
            branch: intersite_x
          - label: eta085-u1000-y
            Jx: 0.0621621621621622
            Jy: 0.0528378378378378
            ax: 0.10
            ay: 0.12
            U: 1.0
            V1: 0.0
            branch: intersite_y

          # Reuse V1=3.2 meV; evaluate the diagonal-favoured side.
          - label: fulliso-u1000-v0036-x
            Jx: 0.0575
            Jy: 0.0575
            ax: 0.10
            ay: 0.10
            U: 1.0
            V1: 0.0036
            branch: intersite_x
          - label: fulliso-u1000-v0036-diag
            Jx: 0.0575
            Jy: 0.0575
            ax: 0.10
            ay: 0.10
            U: 1.0
            V1: 0.0036
            branch: diagonal

          # Reuse V1=15.0 meV; evaluate the separated-favoured side.
          - label: fulliso-u1000-v0160-diag
            Jx: 0.0575
            Jy: 0.0575
            ax: 0.10
            ay: 0.10
            U: 1.0
            V1: 0.0160
            branch: diagonal
          - label: fulliso-u1000-v0160-sep
            Jx: 0.0575
            Jy: 0.0575
            ax: 0.10
            ay: 0.10
            U: 1.0
            V1: 0.0160
            branch: separated

          # Reuse V1=310 meV; evaluate the onsite-favoured side.
          - label: fulliso-u0525-v309-on
            Jx: 0.0575
            Jy: 0.0575
            ax: 0.10
            ay: 0.10
            U: 0.525
            V1: 0.309
            branch: onsite
          - label: fulliso-u0525-v309-sep
            Jx: 0.0575
            Jy: 0.0575
            ax: 0.10
            ay: 0.10
            U: 0.525
            V1: 0.309
            branch: separated
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run strict seeded 20x20 branch benchmark
        run: >-
          python experiments/bipolaron_branch_benchmark_seeded.py
          --size 20
          --u ${{ matrix.U }}
          --v1 ${{ matrix.V1 }}
          --branch ${{ matrix.branch }}
          --j0x ${{ matrix.Jx }}
          --j0y ${{ matrix.Jy }}
          --alpha-x ${{ matrix.ax }}
          --alpha-y ${{ matrix.ay }}
          --max-iterations 1200
          --output strict20-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-isotropy-strict20-${{ matrix.label }}
          path: strict20-${{ matrix.label }}
          if-no-files-found: error
