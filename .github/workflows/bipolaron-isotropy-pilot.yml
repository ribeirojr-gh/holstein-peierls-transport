name: bipolaron-isotropy-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-isotropy-pilot.yml
  workflow_dispatch:

jobs:
  eta-crossing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: u0525-eta-crossing
            U: 0.525
            eta_values: "0.790 0.795 0.800"
          - label: u1000-eta-crossing
            U: 1.000
            eta_values: "0.870 0.875 0.880"
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Close fixed-bandwidth anisotropy crossing
        run: >-
          python experiments/bipolaron_anisotropy_scan.py
          --size 10
          --u ${{ matrix.U }}
          --v1 0.0
          --hopping-sum 0.115
          --eta-values ${{ matrix.eta_values }}
          --alpha-x 0.10
          --alpha-y 0.12
          --max-iterations 1200
          --output isotropy-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-isotropy-${{ matrix.label }}
          path: isotropy-${{ matrix.label }}
          if-no-files-found: error

  isotropic-v1:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: u0525-fulliso-v1
            U: 0.525
            v1_values: "0.000 0.020 0.050 0.100 0.150 0.200 0.250"
          - label: u1000-fulliso-v1
            U: 1.000
            v1_values: "0.000 0.002 0.003 0.004 0.006 0.010 0.015 0.020 0.030"
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Scan V1 at fully isotropic endpoint
        run: >-
          python experiments/bipolaron_v1_scan.py
          --size 10
          --u-values ${{ matrix.U }}
          --v1-values ${{ matrix.v1_values }}
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y 0.10
          --max-iterations 1200
          --output isotropy-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-isotropy-${{ matrix.label }}
          path: isotropy-${{ matrix.label }}
          if-no-files-found: error
