name: bipolaron-isotropy-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-isotropy-pilot.yml
  workflow_dispatch:

jobs:
  v1-map:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: u0525-fulliso-refined
            U: 0.525
            v1_values: "0.280 0.300 0.310 0.320 0.340"
            alpha_y: 0.10
          - label: u1000-fulliso-refined
            U: 1.000
            v1_values: "0.0030 0.0031 0.0032 0.0145 0.0148 0.0150"
            alpha_y: 0.10
          - label: u0525-hopping-only-isotropic
            U: 0.525
            v1_values: "0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350"
            alpha_y: 0.12
          - label: u1000-hopping-only-isotropic
            U: 1.000
            v1_values: "0.000 0.002 0.004 0.006 0.010 0.015 0.020 0.030"
            alpha_y: 0.12
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Scan isotropic hopping V1 phase structure
        run: >-
          python experiments/bipolaron_v1_scan.py
          --size 10
          --u-values ${{ matrix.U }}
          --v1-values ${{ matrix.v1_values }}
          --j0x 0.0575
          --j0y 0.0575
          --alpha-x 0.10
          --alpha-y ${{ matrix.alpha_y }}
          --max-iterations 1200
          --output isotropy-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-isotropy-${{ matrix.label }}
          path: isotropy-${{ matrix.label }}
          if-no-files-found: error
