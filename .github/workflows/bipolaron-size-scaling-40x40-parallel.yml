name: bipolaron-size-scaling-40x40-parallel

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'experiments/bipolaron_branch_benchmark.py'
      - '.github/workflows/bipolaron-size-scaling-40x40-parallel.yml'
  workflow_dispatch:

jobs:
  branch-benchmark:
    strategy:
      fail-fast: false
      matrix:
        u: ['0.525', '1.000']
        branch: ['intersite_x', 'separated']
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Relax selected 40x40 branch
        run: |
          python experiments/bipolaron_branch_benchmark.py \
            --size 40 \
            --alpha-x 0.100 \
            --alpha-y 0.120 \
            --u ${{ matrix.u }} \
            --branch ${{ matrix.branch }} \
            --max-iterations 1200 \
            --output branch-40-U${{ matrix.u }}-${{ matrix.branch }}
      - name: Upload branch result
        uses: actions/upload-artifact@v4
        with:
          name: branch-40-U${{ matrix.u }}-${{ matrix.branch }}
          path: branch-40-U${{ matrix.u }}-${{ matrix.branch }}/
          retention-days: 90
