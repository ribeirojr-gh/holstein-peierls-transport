name: bipolaron-finite-size

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - 'src/holstein_peierls/two_particle/**'
      - 'experiments/bipolaron_finite_size.py'
      - '.github/workflows/bipolaron-finite-size.yml'
  workflow_dispatch:

jobs:
  finite-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run finite-size diagnostic
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_finite_size.py
          --sizes 6 8 10
          --u-values 0.55 0.70 1.00
          --output bipolaron-finite-size
      - name: Upload finite-size results
        uses: actions/upload-artifact@v4
        with:
          name: bipolaron-finite-size-6-8-10
          path: bipolaron-finite-size/
          retention-days: 90
