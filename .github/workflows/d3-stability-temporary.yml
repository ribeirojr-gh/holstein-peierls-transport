name: d3-stability-temporary

on:
  pull_request:
    branches: [main]

jobs:
  d3-stability:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run 10 ps D3 stability gate
        run: |
          mkdir -p benchmark
          python experiments/d3_long_stability.py \
            --size 20 \
            --field-mv-per-a 2.0 \
            --final-time-fs 10000.0 \
            --dt-fs 0.2 \
            --krylov-dimension 6 \
            --output benchmark/d3-stability.json \
            --markdown benchmark/d3-stability.md
          cat benchmark/d3-stability.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-field-driven-stability
          path: benchmark/d3-stability.*
          if-no-files-found: warn
