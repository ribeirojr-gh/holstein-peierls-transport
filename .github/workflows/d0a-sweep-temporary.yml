name: d0a-sweep-temporary

on:
  pull_request:

jobs:
  sweep:
    if: github.head_ref == 'd0a-propagator-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run D0a propagator sweep
        run: |
          mkdir -p benchmark
          python experiments/d0a_propagator_sweep.py \
            --total-time-fs 2.0 \
            --krylov-dimensions 4 6 8 12 \
            --output benchmark/d0a-sweep.json \
            --markdown benchmark/d0a-sweep.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d0a-propagator-sweep
          path: benchmark/d0a-sweep.*
