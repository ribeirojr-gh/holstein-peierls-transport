name: bipolaron-v1-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-v1-pilot.yml
  workflow_dispatch:

jobs:
  refine-u0525:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Refine structural crossover and high-V1 onsite branch
        run: >-
          python experiments/bipolaron_v1_scan.py
          --size 10
          --u-values 0.525
          --v1-values 0.020 0.024 0.026 0.028 0.030 0.032 0.036 0.040 0.080 0.100 0.150 0.200
          --alpha-x 0.10
          --alpha-y 0.12
          --output v1-refine-U0.525
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-v1-refine-U0.525
          path: v1-refine-U0.525
          if-no-files-found: error

  refine-u1000:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Refine dissociation crossover
        run: >-
          python experiments/bipolaron_v1_scan.py
          --size 10
          --u-values 1.000
          --v1-values 0.004 0.005 0.006 0.0065 0.007 0.0075 0.008 0.009 0.010
          --alpha-x 0.10
          --alpha-y 0.12
          --output v1-refine-U1.000
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-v1-refine-U1.000
          path: v1-refine-U1.000
          if-no-files-found: error
