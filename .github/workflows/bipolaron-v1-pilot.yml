name: bipolaron-v1-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-v1-pilot.yml
  workflow_dispatch:

jobs:
  size-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: u1000-v0060
            U: 1.000
            V1: 0.0060
            branches: 'intersite_x separated'
          - label: u1000-v0065
            U: 1.000
            V1: 0.0065
            branches: 'intersite_x separated'
          - label: u0525-v026
            U: 0.525
            V1: 0.026
            branches: 'intersite_x onsite separated'
          - label: u0525-v028
            U: 0.525
            V1: 0.028
            branches: 'intersite_x onsite separated'
          - label: u0525-v180
            U: 0.525
            V1: 0.180
            branches: 'onsite separated'
          - label: u0525-v185
            U: 0.525
            V1: 0.185
            branches: 'onsite separated'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run targeted 20x20 V1 branch comparison
        run: >-
          python experiments/bipolaron_v1_scan.py
          --size 20
          --u-values ${{ matrix.U }}
          --v1-values ${{ matrix.V1 }}
          --branches ${{ matrix.branches }}
          --alpha-x 0.10
          --alpha-y 0.12
          --output size20-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-v1-size20-${{ matrix.label }}
          path: size20-${{ matrix.label }}
          if-no-files-found: error
