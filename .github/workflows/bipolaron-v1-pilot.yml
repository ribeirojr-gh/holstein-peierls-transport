name: bipolaron-v1-pilot

on:
  push:
    branches: [two-particle-coulomb]
    paths:
      - .github/workflows/bipolaron-v1-pilot.yml
  workflow_dispatch:

jobs:
  refine-high-v1:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Refine onsite-to-separated crossover
        run: >-
          python experiments/bipolaron_v1_scan.py
          --size 10
          --u-values 0.525
          --v1-values 0.160 0.170 0.175 0.180 0.185 0.190 0.195 0.200
          --alpha-x 0.10
          --alpha-y 0.12
          --output v1-high-U0.525
      - uses: actions/upload-artifact@v4
        with:
          name: bipolaron-v1-high-U0.525
          path: v1-high-U0.525
          if-no-files-found: error
