name: combined-screening-range10

on:
  push:
    branches: [combined-screening-range-sensitivity]
    paths:
      - .github/workflows/combined-screening-range10.yml
  workflow_dispatch:

jobs:
  range10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run 10x10 range sensitivity scan
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          import subprocess
          from pathlib import Path

          prefactor = 14.3996454784255
          spacing = 7.0
          eta = 0.75
          root = Path('range10')
          root.mkdir(exist_ok=True)

          models = {
              'R1_cardinal': [(1, 0), (0, 1)],
              'R2_cardinal_diagonal': [(1, 0), (0, 1), (1, 1)],
              'R3_through_second_axial': [
                  (1, 0), (0, 1), (1, 1), (2, 0), (0, 2)
              ],
          }
          grids = {
              0.525: [4.5, 5.0, 5.5, 6.0, 6.5],
              1.0: [350.0, 400.0, 450.0, 500.0, 550.0],
          }
          branches = {
              0.525: ['onsite', 'intersite_x', 'diagonal', 'separated'],
              1.0: ['intersite_x', 'diagonal', 'separated'],
          }
          summary = []

          def continuum(dx: int, dy: int, epsilon: float) -> float:
              r = spacing * math.sqrt(dx * dx + dy * dy)
              return prefactor / epsilon / r

          def run_case(model: str, shells, u: float, epsilon: float) -> None:
              out = root / model / f'U{u:g}' / f'eps{epsilon:g}'
              command = [
                  'python', 'experiments/bipolaron_long_range_coulomb_scan.py',
                  '--size', '10',
                  '--u-values', str(u),
                  '--epsilon-values', str(epsilon),
                  '--branches', *branches[u],
                  '--max-iterations', '1100',
                  '--output', str(out),
              ]
              for dx, dy in shells:
                  value = eta * continuum(dx, dy, epsilon)
                  command.extend(['--shell-override', f'{dx},{dy},{value:.15g}'])
              subprocess.run(command, check=True)
              data = json.loads((out / 'long_range_scan.json').read_text())
              minimum = data['minima'][0]
              minimum['model'] = model
              minimum['eta'] = eta if shells else 1.0
              summary.append(minimum)

          # Sparse pure-tail continuity controls around the known 10x10 boundaries.
          for u, eps_values in {0.525: [6.5, 7.0], 1.0: [550.0, 600.0]}.items():
              for epsilon in eps_values:
                  run_case('R0_pure_continuum', [], u, epsilon)

          for model, shells in models.items():
              for u, eps_values in grids.items():
                  for epsilon in eps_values:
                      run_case(model, shells, u, epsilon)

          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('\n=== COMBINED SUMMARY ===')
          for row in summary:
              print(
                  f"{row['model']:26s} U={row['U_eV']:.3f} "
                  f"eps={row['epsilon_r']:7.2f} "
                  f"state={row['best_final_state']:11s} "
                  f"Ebind={1000*row['binding_vs_2polaron_eV']:+10.5f} meV "
                  f"sep-excess={1000*row['finite_separated_excess_eV']:+10.5f} meV "
                  f"conv={row['all_branches_converged']}"
              )
          PY
      - name: Upload 10x10 range outputs
        uses: actions/upload-artifact@v4
        with:
          name: combined-screening-range10-${{ github.sha }}
          path: range10
          if-no-files-found: error
          retention-days: 30
