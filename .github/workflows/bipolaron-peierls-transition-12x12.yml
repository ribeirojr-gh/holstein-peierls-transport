name: bipolaron-peierls-transition-12x12

on:
  push:
    branches: [two-particle-static-theory]
    paths:
      - '.github/workflows/bipolaron-peierls-transition-12x12.yml'
  workflow_dispatch:

jobs:
  transition-12x12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alpha_y: ['0.000', '0.120']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Resolve onsite to intersite-x transition
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python experiments/bipolaron_peierls_scan.py
          --size 12
          --alpha-x-values 0.000 0.050 0.100
          --alpha-y ${{ matrix.alpha_y }}
          --u-values 0.4925 0.4950 0.4975 0.5000 0.5025 0.5050 0.5075 0.5100 0.5125
          --max-iterations 1400
          --displacement-tolerance 1e-6
          --gradient-tolerance 2e-5
          --output transition-12x12-ay-${{ matrix.alpha_y }}
      - name: Upload transition results
        uses: actions/upload-artifact@v4
        with:
          name: transition-12x12-ay-${{ matrix.alpha_y }}
          path: transition-12x12-ay-${{ matrix.alpha_y }}/
          retention-days: 90
