[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holstein-peierls-transport"
version = "0.4.0a1"
description = "Validated static one-polaron tools and correlated static two-particle Holstein-Peierls solvers with extended-Hubbard interactions."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Luiz A. Ribeiro Junior"}
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hp-polaron = "holstein_peierls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
